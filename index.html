<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Time Rogue</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Inter:wght@400;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div id="app">
    <div id="auth-screen" class="screen active">
      <div class="logo">
        <div class="auth-logo-row">
          <div class="shop-logo-placeholder auth-shop-logo">Shop</div>
          <div class="logo-small"><img src="time-rogue-logo.jpg" alt="Time Rogue" class="tr-logo" style="height:48px; width:auto;"></div>
        </div>
        <img src="time-rogue-logo.jpg" alt="Time Rogue" style="height:72px; width:auto; margin:0.5rem auto; display:block;">
      </div>
      <form id="auth-form" onsubmit="return false;">
        <input type="email" id="email" placeholder="Email" required>
        <input type="password" id="password" placeholder="Password" required>
        <button type="submit" id="login-btn">Log In</button>
        <button type="button" id="signup-btn">Create Account</button>
        <button type="button" id="forgot-btn">Forgot Password?</button>
        <button type="button" id="kiosk-login-btn">Kiosk Login</button>
      </form>
      <div id="kiosk-login-panel" style="display:none; max-width:320px; margin:1.5rem auto; text-align:center;">
        <input type="password" id="kiosk-code-input" placeholder="Enter kiosk code" style="width:100%; padding:0.6rem; margin-bottom:0.5rem;">
        <button type="button" id="kiosk-code-submit" style="margin-right:0.5rem;">Unlock Kiosk</button>
        <button type="button" id="kiosk-code-cancel">Cancel</button>
        <p id="kiosk-login-status" style="margin-top:0.75rem; font-size:0.9rem;"></p>
      </div>
      <p class="note">One-off purchase unlocks basic features for one store.</p>
    </div>

    <div id="kiosk-screen" class="screen">
      <header class="kiosk-header">
        <div class="kiosk-left">
          <div class="shop-logo-placeholder kiosk-header-logo">Shop</div>
          <div class="logo-small"><img src="time-rogue-logo.jpg" alt="Time Rogue" style="height:36px; width:auto;"></div>
        </div>
        <div id="current-time" class="retro-time"></div>
        <div class="kiosk-right">
          <button id="member-btn">Member Portal</button>
          <button id="admin-btn">Admin</button>
        </div>
      </header>
      <div id="pin-section" class="pin-container">
        <h2>Enter Your PIN</h2>
        <div id="pin-dots" class="pin-dots"></div>
        <p class="pin-hint">Enter your 4-digit PIN to clock in or out</p>
        <div class="keypad" id="keypad"></div>
      </div>
      <div id="welcome-section" class="welcome-container" style="display:none;">
        <h1 id="welcome-message">Welcome</h1>
        <div id="action-buttons" class="action-grid"></div>
        <div class="bottom-logos">
          <div class="shop-logo-placeholder">Shop</div>
          <div class="divider"></div>
          <div class="logo-small"><img src="time-rogue-logo.jpg" alt="Time Rogue" style="height:36px; width:auto;"></div>
        </div>
        <button id="back-to-pin" class="back-link">Back</button>
      </div>
      <div id="status-message"></div>
    </div>

    <div id="admin-password-screen" class="screen">
      <div class="logo"><div class="clock-icon"></div><h1>Admin Access</h1></div>
      <form id="admin-password-form" style="max-width:320px; margin:0 auto; display:flex; flex-direction:column; gap:1rem;">
        <input type="password" id="admin-password" placeholder="Admin Password" required>
        <button type="submit">Enter Admin</button>
        <button type="button" id="cancel-admin">Cancel</button>
      </form>
    </div>

    <div id="member-login-screen" class="screen">
      <div class="logo"><div class="clock-icon"></div><h1>Member Portal</h1></div>
      <form id="member-login-form" style="max-width:320px; margin:0 auto; display:flex; flex-direction:column; gap:1rem;">
        <input type="email" id="member-email" placeholder="Email" required>
        <input type="password" id="member-password" placeholder="Password" required>
        <button type="submit">Log In</button>
        <button type="button" id="cancel-member">Cancel</button>
      </form>
    </div>

    <div id="member-screen" class="screen">
      <header class="admin-header">
        <div class="logo-small"><img src="time-rogue-logo.jpg" alt="Time Rogue" style="height:36px; width:auto;"></div>
        <button id="exit-member">Exit</button>
      </header>
      <div id="member-content" style="padding:1.5rem;"></div>
    </div>

    <div id="admin-screen" class="screen">
      <header class="admin-header">
        <div class="header-left">
          <div class="shop-logo-placeholder small">Shop</div>
          <div class="logo-small"><img src="time-rogue-logo.jpg" alt="Time Rogue" style="height:36px; width:auto;"></div>
        </div>
        <div class="header-right">
          <button id="exit-admin">Exit</button>
        </div>
      </header>
      <div class="tabs">
        <button class="tab active" data-tab="staff">Staff</button>
        <button class="tab" data-tab="schedule">Schedule</button>
        <button class="tab" data-tab="timesheets">Timesheets</button>
        <button class="tab" data-tab="settings">Settings</button>
      </div>
      <div id="staff-tab" class="tab-content active"></div>
      <div id="schedule-tab" class="tab-content"></div>
      <div id="timesheets-tab" class="tab-content"></div>
      <div id="settings-tab" class="tab-content"></div>
    </div>
  </div>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
