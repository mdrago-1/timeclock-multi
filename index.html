<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>TimeClock</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div id="app">
    <!-- Auth Screen -->
    <div id="auth-screen" class="screen active">
      <div class="logo">
        <div class="clock-icon"></div>
        <h1>TimeClock</h1>
      </div>
      <form id="auth-form">
        <input type="email" id="email" placeholder="Email" required>
        <input type="password" id="password" placeholder="Password" required>
        <button type="submit" id="login-btn">Log In</button>
        <button type="button" id="signup-btn">Create Account</button>
      </form>
      <p class="note">One-off purchase unlocks basic features for one store.</p>
    </div>

    <!-- Kiosk Screen -->
    <div id="kiosk-screen" class="screen">
      <header>
        <div class="logo-small"><div class="clock-icon"></div> TimeClock</div>
        <div id="current-time"></div>
        <button id="admin-btn">Admin</button>
      </header>
      <div id="pin-section">
        <div id="pin-display">Enter PIN</div>
        <div class="keypad" id="keypad"></div>
      </div>
      <div id="welcome-section" style="display:none;">
        <div id="welcome-message"></div>
        <div id="action-buttons"></div>
        <button id="back-to-pin">Back</button>
      </div>
      <div id="status-message"></div>
    </div>

    <!-- Admin Screen -->
    <div id="admin-screen" class="screen">
      <header>
        <div class="logo-small"><div class="clock-icon"></div> TimeClock</div>
        <button id="exit-admin">Exit</button>
      </header>
      <div class="tabs">
        <button class="tab active" data-tab="staff">Staff</button>
        <button class="tab" data-tab="schedule">Schedule</button>
        <button class="tab" data-tab="timesheets">Timesheets</button>
      </div>
      <div id="staff-tab" class="tab-content active"></div>
      <div id="schedule-tab" class="tab-content"></div>
      <div id="timesheets-tab" class="tab-content"></div>
    </div>
  </div>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
